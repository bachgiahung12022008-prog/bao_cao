<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sổ điểm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="bar" id="bar">
    <div class="brand"><span data-ico="logo"></span><span>Sổ điểm</span></div>
    <div class="spacer"></div>
    <div class="mini tint" id="mini" hidden><span id="miniLab"></span><b id="miniVal"></b></div>
    <div class="bar-btns">
      <button type="button" class="icon-btn" data-act="openData" aria-label="Nhập hoặc xuất bảng điểm" title="Nhập hoặc xuất"><span data-ico="swap"></span></button>
      <button type="button" class="icon-btn" data-act="openCfg" aria-label="Cài đặt" title="Cài đặt"><span data-ico="sliders"></span></button>
      <button type="button" class="icon-btn" data-act="theme" aria-label="Đổi giao diện sáng hoặc tối" title="Sáng hoặc tối"><span data-ico="theme"></span></button>
    </div>
  </header>
  <main>
    <div class="seg" id="modeSeg" role="group" aria-label="Chọn đối tượng">
      <button type="button" data-act="mode" data-v="hs" aria-pressed="true">Học sinh</button>
      <button type="button" data-act="mode" data-v="uni" aria-pressed="false">Sinh viên</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Học kỳ"></nav>
    <div id="view"></div>
    <p class="foot">Điểm được lưu ngay trên thiết bị này và không gửi đi đâu. Kết quả chỉ để tham khảo, hãy đối chiếu với quy chế của trường bạn.</p>
  </main>
</div>

<dialog id="dlgCfg" aria-labelledby="cfgTitle">
  <div class="dlg">
    <div class="dlg-head"><h2 id="cfgTitle">Cài đặt</h2><button type="button" class="icon-btn" data-act="close" aria-label="Đóng"><span data-ico="close"></span></button></div>
    <div class="dlg-body" id="cfgBody"></div>
  </div>
</dialog>
<dialog id="dlgData" aria-labelledby="dataTitle">
  <div class="dlg">
    <div class="dlg-head"><h2 id="dataTitle">Nhập và xuất điểm</h2><button type="button" class="icon-btn" data-act="close" aria-label="Đóng"><span data-ico="close"></span></button></div>
    <div class="dlg-body" id="dataBody"></div>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
